[plugin]
id = "com.ticksy.steam-rating-pulse"
name = "ReviewLens"
version = "1.5.10"
author = "Ticksy"
description = "Displays Steam community scores, star ratings, recent review trends and review counts in your library."

[backend]
entry = "backend/main.lua"
sources = ["backend/**/*.lua"]

[frontend]
entry = "frontend/index.tsx"

[compiler]
output_path = "auto"

[dev]
auto_restart = true
reload_steamui_when = "both"

[logger]
backend_prefix = "RATING BCK"
frontend_prefix = "RATING FRT"
